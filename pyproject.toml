[project]
name = "agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "126573242+errami01@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
agent-smith = "student:main"
sandbox = "student.cli:main_sandbox"


[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "student"
module-root = ""

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]
